syntax = "proto3";

import "error.proto";
import "pose.proto";

package vision_grasp.graspnet_candidate;

message GraspCandidateRequest {
  string target_class = 1;
  string target_color = 2;
  uint32 max_candidates = 3;
  bool detect_collision = 4;
  bool build_o3d = 5;
}

message GraspCandidate {
  uint32 rank = 1;
  float  score = 2;
  float  width = 3;
  genisys.protocols.Pose flange_grasp_pose = 4;
}

message GraspCandidateResponse {
  repeated GraspCandidate candidates = 1;
  aimrt.protocols.common.Error error = 2;
}

service GraspCandidateService {
  rpc GetGraspCandidates(GraspCandidateRequest) returns (GraspCandidateResponse);
}