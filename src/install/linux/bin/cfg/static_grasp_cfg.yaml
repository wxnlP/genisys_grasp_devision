aimrt:
  log:
    core_lvl: INFO # Trace/Debug/Info/Warn/Error/Fatal/Off
    backends:
      - type: console
  module:
    pkgs:
      - path: ./libgrasp_decision_pkg.so
        disable_modules: [DynamicGraspModule]
    modules:
      - name: StaticGraspModule
        log_lvl: INFO
      - name: DynamicGraspModule
        log_lvl: INFO
  executor:
    executors:
      - name: work_executor
        type: asio_thread
        options:
          thread_num: 1
  plugin:
    plugins:
      - name: zenoh_plugin
        path: ./libaimrt_zenoh_plugin.so
        options:
          native_cfg_path: ./cfg/zenoh_native_config.json5

    channel:
    backends:
      - type: local # 官方支持local后端
      - type: zenoh
        options:
          pub_topics_options:
            - topic_name: "(.*)"
              shm_enabled: false
    pub_topics_options:
      - topic_name: "(.*)" # 正则表达式
        enable_backends: [local, zenoh]
        enable_filters: []
    sub_topics_options:
      - topic_name: "(.*)"
        enable_backends: [zenoh]
        enable_filters: []
  rpc:
    backends:
      - type: zenoh
        options:
          clients_options:
            - func_name: "(.*)"
              shm_enabled: false
    clients_options:
      - func_name: "(.*)"
        enable_backends: [zenoh]
        enable_filters: []
    servers_options:
      - func_name: "(.*)"
        enable_backends: [zenoh]
        enable_filters: []

# Module custom configuration
StaticGraspModule:
  work_executor_name: work_executor
  topic_flange_pose: geniarm/flange_pose
  rpc_frq: 1.0
